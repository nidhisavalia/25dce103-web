<!DOCTYPE html>
<html>
<head>
    <title>Feedback</title>
    <link rel="stylesheet" href="all.css">
</head>
<body>

    <div class="container">
        <h1>Feedback Form</h1>

        <form>
            <label>Name:</label>
            <input type="text">

            <label>Email:</label>
            <input type="email">

            <label>Course:</label>
            <input type="text">

            <label>Feedback:</label>
            <textarea rows="5"></textarea>

            <label>Rating:</label>

            <div class="rating">
                <input type="radio" name="rating"> Excellent<br>
                <input type="radio" name="rating"> Good<br>
                <input type="radio" name="rating"> Average<br>
                <input type="radio" name="rating"> Poor
            </div>

            <input type="submit" value="Submit">
            <input type="reset" value="Clear">
        </form>
    </div>
          <script src="all.js"></script>
</body>
</html>
